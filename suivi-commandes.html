<title>Suivi des commandes</title>
<!-- GTM-GROUPE : reprise de l'application « Suivi PERCKO », affichée dans un cadre par suivi-module.js.
     Les données passent par window.parent.grpSuiviStore (getJSON/setJSON du groupe, dossier Firebase liaison/).
     ?vue=gadh : seules les étapes de la GADH (envoi, assemblage, retour) et la fiche assemblage. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : en-tête fixe (lot, client), contenu défilant, barre d'onglets en bas.
   Palette : bleu de chauffe (encre), jaune de saisie (comme les cellules jaunes du tableau Excel), vert/rouge pour l'état. */
:root{
  --bg:#edf0f4; --card:#ffffff; --ink:#18212f; --mut:#5d6779; --line:#d6dce6;
  --pri:#1d3557; --pri-ink:#ffffff; --acc:#2a6f97; --edit:#fff3bf; --edit-line:#e7cf6a;
  --ok:#1b7a3d; --bad:#b3261e; --bad-bg:#fde1de; --head:#1d3557; --sub:#e4eaf3; --tot:#d5e1f1;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151e; --card:#18212e; --ink:#e6ebf3; --mut:#9aa6ba; --line:#2b3748;
  --pri:#6ea8d9; --pri-ink:#0b1420; --acc:#7db7e6; --edit:#4a3f14; --edit-line:#8a7424;
  --ok:#6fcf8f; --bad:#ff8a80; --bad-bg:#4a1f1c; --head:#25364f; --sub:#212d3e; --tot:#2a3b55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151e; --card:#18212e; --ink:#e6ebf3; --mut:#9aa6ba; --line:#2b3748;
  --pri:#6ea8d9; --pri-ink:#0b1420; --acc:#7db7e6; --edit:#4a3f14; --edit-line:#8a7424;
  --ok:#6fcf8f; --bad:#ff8a80; --bad-bg:#4a1f1c; --head:#25364f; --sub:#212d3e; --tot:#2a3b55; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;margin:0}
*{box-sizing:border-box}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 16px 8px;background:var(--head);color:#fff;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
header h1{font-size:17px;margin:0;font-weight:600;flex:1 1 100%}
header label{display:flex;flex-direction:column;font-size:11px;gap:2px;flex:1 1 130px;min-width:0;opacity:.95}
header select{font:inherit;padding:7px 8px;border-radius:8px;border:0;background:#fff;color:#18212f;min-width:0;width:100%}
#view{flex:1;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button b{font-family:var(--cond);font-size:18px;line-height:1;font-weight:600}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 8px;font-weight:600}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px;flex:1 1 130px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 9px;min-width:0;width:100%}
input[type=file]{padding:6px}
button.btn{font:inherit;font-weight:500;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri)}
button.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
button.btn.small{padding:5px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.grid7{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid7 label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.grid7 input{text-align:right}
.grid7 input:disabled{opacity:.35}
.ed{background:var(--edit)!important;border-color:var(--edit-line)!important}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;font-family:var(--cond);font-size:14px;width:100%}
th,td{padding:5px 7px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:var(--head);color:#fff;font-weight:500;white-space:normal;line-height:1.15;text-align:center;font-size:12px;vertical-align:bottom}
td.l,th.l{text-align:left}
tr.gh td{background:var(--sub);font-weight:600;text-align:left}
tr.tot td{background:var(--tot);font-weight:600}
tr.pc td{color:var(--mut);font-size:12px}
td input{width:62px;padding:4px 5px;text-align:right;font-family:var(--cond);font-size:14px;border-radius:5px}
td.bad,td.bad input{background:var(--bad-bg)!important;color:var(--bad);font-weight:600}
td.ok{color:var(--ok);font-weight:600}
td.sticky,th.sticky{position:sticky;left:0;z-index:1;background:var(--card);text-align:left}
th.sticky{background:var(--head);z-index:2}
tr.gh td.sticky{background:var(--sub)}
tr.tot td.sticky{background:var(--tot)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:rgba(27,122,61,.15);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.na{background:var(--sub);color:var(--mut)}
.ocard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.ocard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.ocard .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ocard .cut{font-family:var(--cond);color:var(--mut);font-size:12px;text-align:right}
.msg{padding:9px 12px;border-radius:8px;background:var(--sub);margin-top:10px;font-size:13px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat div{flex:1 1 110px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--cond);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#18212f;color:#fff;padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;z-index:10;font-size:14px}
#toast.on{opacity:1}
table td,table th{font-variant-numeric:tabular-nums}

.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.seg button{font:inherit;font-size:14px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
details.card>summary{cursor:pointer;font-weight:600}
.sheetwrap{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
table.sheet{width:100%;table-layout:fixed}
table.sheet th{position:sticky;top:0;z-index:3}
table.sheet td{white-space:normal;overflow-wrap:break-word;vertical-align:middle;padding:1px 4px}
table.sheet td.mdl{font-size:11px;color:var(--mut)}
table.sheet td.lib{font-weight:600;font-size:13px}
table.sheet td.sz{text-align:center;white-space:nowrap}
table.sheet tr.gstart td{border-top:2px solid var(--line)}
table.sheet td input{width:100%;padding:3px 5px;font-size:15px}
table.sheet td.cut{color:var(--mut);font-size:13px}
table.sheet tr.ml td{color:var(--acc);font-weight:500}
table.sheet td.b{font-weight:600}
.fhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px}

.xlwrap{background:#fff;color:#000;border:1px solid var(--line);border-radius:6px;overflow:auto;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.xlwrap.tall{max-height:calc(100vh - 230px);min-height:300px}
table.xl{border-collapse:collapse;table-layout:fixed;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#000;width:auto}
table.xl td{white-space:nowrap;overflow:hidden;padding:0 3px;border:0;vertical-align:middle;font-variant-numeric:tabular-nums}
table.entry{width:354px}
table.entry th{position:sticky;top:0;z-index:3;background:#fff;color:#c00000;border:2px solid #000;font:700 12px Arial,sans-serif;padding:3px;text-align:center;white-space:nowrap}
table.entry td{border:1px solid #000;font-size:11px;height:25px}
table.entry td.mdl{font-size:10px;text-align:center;white-space:normal}
table.entry td.lib{font-size:10px;text-align:left;white-space:normal;line-height:1.1}
table.entry td.sz{text-align:center;font-weight:700}
table.entry td.fr{padding:1px}
table.entry td.tot{text-align:center;font-size:13px}
table.entry td input{width:100%;height:22px;padding:0 4px;font:13px Arial,sans-serif;color:#000;background:#fff3bf;border:1px solid #e7cf6a;border-radius:3px;text-align:right}
table.entry td input.ed,.xlwrap input.ed{background:#fff3bf!important;border-color:#e7cf6a!important;color:#000!important}
.xlwrap input{color:#000}
table.entry tr.gstart td{border-top:2px solid #000}

header .fixed{background:rgba(255,255,255,.15);border-radius:8px;padding:7px 8px;font-weight:600;letter-spacing:.04em}
.pill.wip{background:rgba(42,111,151,.16);color:var(--acc)}
.top2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cl{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.bar .bl{display:flex;flex-direction:column;font-size:11px;color:var(--mut);line-height:1.15}
.bar .bl b{font-family:var(--cond);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar .bt{height:6px;background:var(--sub);border-radius:3px;margin-top:3px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--acc)}
.bar .bp{font-size:10.5px;color:var(--mut);margin-top:2px}
table.flux td.fr{padding:2px 3px}
table.flux td.fr input{width:78px}
nav button{font-size:11px}

/* ---- finition ---- */
:root{--shadow:0 1px 2px rgba(20,40,63,.07),0 6px 18px rgba(20,40,63,.06);--radius:14px}
body{letter-spacing:.005em}
header{background:linear-gradient(135deg,#12263f 0%,#23466f 100%);padding:12px 16px 12px;gap:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;z-index:5}
header h1{font-size:18px;letter-spacing:.01em}
header .brand{display:flex;align-items:center;gap:11px;flex:1 1 100%}
header .logo{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#fff;color:#12263f;font:700 15px var(--cond);letter-spacing:.04em}
header .sub{font-size:12px;opacity:.75;margin-top:1px}
header label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;opacity:.8;gap:4px}
header select{border-radius:10px;padding:8px 10px;font-weight:600;text-transform:none;letter-spacing:0}
header .fixed{border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.14);font-weight:700;text-transform:none;letter-spacing:.08em}
.card{border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h2{font-size:16px}
.stat div{border-radius:var(--radius);box-shadow:var(--shadow);border-left:4px solid var(--acc);padding:10px 14px}
.stat b{font-size:26px;color:var(--pri)}
.btn{border-radius:10px;min-height:40px;font-weight:600;padding:9px 16px;transition:transform .08s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn.small{min-height:34px;padding:6px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.seg button{min-height:38px;border-radius:99px;font-weight:500}
.seg button.on{box-shadow:0 2px 8px rgba(29,53,87,.28)}
input,select,textarea{border-radius:10px;min-height:40px}
input:focus,select:focus{border-color:var(--acc)}
nav{box-shadow:0 -4px 16px rgba(20,40,63,.08)}
nav button{gap:4px;font-weight:500;position:relative}
nav button b{display:block;line-height:0}
nav button b svg{width:23px;height:23px;display:block}
nav button.on{box-shadow:none;font-weight:600}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--pri)}
.card.ord{border-left:5px solid var(--acc)}
.card.ord.ok{border-left-color:var(--ok)}
.card.ord.na{border-left-color:var(--line)}
.pill{padding:3px 10px;font-size:12px}
.bar .bt{height:8px;border-radius:4px}
.bar .bt i{background:linear-gradient(90deg,var(--acc),var(--pri))}
.cl{margin-top:12px;padding-top:10px}
.fabcard table.fabt{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;font-family:var(--font)}
.fabcard .fabt th{background:var(--head);color:#fff;padding:9px 12px;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.fabcard .fabt th:first-child{border-radius:10px 0 0 0}.fabcard .fabt th:last-child{border-radius:0 10px 0 0}
.fabcard .fabt td{padding:9px 12px;font-size:15px;border-bottom:1px solid var(--line);white-space:normal}
.fabcard .fabt td.b{font-weight:700;font-family:var(--cond);font-size:17px}
.fabcard .fabt tr.tot td{background:var(--tot);font-weight:700;border-bottom:0}
.fabcard .fabt tr.tot td:first-child{border-radius:0 0 0 10px}.fabcard .fabt tr.tot td:last-child{border-radius:0 0 10px 0}
.xlwrap{border-radius:var(--radius);box-shadow:var(--shadow)}
table.entry th{border-width:1px}
#view{padding-top:16px}
@media (min-width:800px){
  header{padding:12px 28px}header .brand{flex:0 0 auto;margin-right:26px}
  .stat b{font-size:30px}
}

/* lisibilité + logo TEK-TREND + précédent/suivant */
body{font-size:16px}
.mut{font-size:14px;color:var(--ink);opacity:.78}
table{font-family:var(--font);font-size:15px;font-weight:500}
th{font-size:13px;font-weight:600}
td input{font-family:var(--font);font-size:15px;font-weight:600}
.card h2{font-size:17px}
button.btn.small{font-size:14px}
nav button{font-size:12px;font-weight:500}
header{background:#1C2430}
header .tt{display:inline-flex;align-items:baseline;font:800 25px/1 var(--font);letter-spacing:.02em;padding:2px 0}
/* vrai logo de la société (image) sur pastille blanche, à la place du nom écrit */
header .tt.tt-logo{align-items:center;background:#fff;border-radius:10px;padding:4px 8px;flex:0 0 auto}
header .tt.tt-logo img{display:block;height:40px;width:auto;max-width:120px;object-fit:contain}
header .tek{color:#5BC0F8}header .trd{color:#fff}header .cm{color:#F5C518;margin-left:1px}
header .sub{font-size:12px;opacity:.85;letter-spacing:.04em}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.pager .mut{flex:1;text-align:center;font-weight:600}
.pager button{padding:9px 12px}
.pager button:disabled{opacity:.35;cursor:default}
.fabcard .fabt td{font-size:16px;font-weight:600}

/* parcours, états, confirmation */
.step{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--card);width:100%;text-align:left;font:inherit;color:inherit}
button.step{cursor:pointer}
.step.on{border-color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sub);font-weight:700;font-size:13px;flex:none}
.step.done .n{background:var(--ok);color:#fff}.step.part .n{background:#e0a100;color:#fff}
.step .nm{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25}
.step .nm small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.step .qt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;font-size:14px}
.step .mb{height:4px;background:var(--sub);border-radius:3px;margin-top:6px;overflow:hidden}
.step .mb i{display:block;height:100%;background:var(--ok)}
.step.part .mb i{background:#e0a100}
.sbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sub)}
.sbar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:3px 10px;border-radius:99px;background:var(--sub)}
.chip s{width:10px;height:10px;border-radius:50%;display:inline-block}
.card.confirm{border:2px solid var(--pri)}

.chip.nc{background:var(--bad-bg);color:var(--bad)}
/* ---- Flux, mode simple ---- */
.sx-titre{font-size:18px;margin:6px 0 10px}
.sx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.sx-tile .aut{font-size:12px;font-weight:700;color:var(--mut)}

.sx-szc.vide{opacity:.45}
.sx-tout{padding:12px 14px;border-radius:14px;background:var(--sub);border:1.5px solid var(--line);margin:0 0 12px}

.sx-cnum{font-family:var(--cond);font-size:28px;font-weight:700;color:var(--pri)}
.sx-cdet{margin:12px 0 16px;border-radius:14px;background:var(--sub);padding:6px 14px}

.sx-cdet b{font-family:var(--cond);font-size:20px}
.sx-head{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.sx-head .sx-nm{font-size:21px}
.sx-nm{font-weight:700;font-size:19px;line-height:1.2}

/* perte / rebut au magasin, ajustement, inventaire (quantité comptée) */

/* =====================================================================

function nomFichier(s){ return String(s).replace(/[^\w.\-]+/g, "_"); }

/* ---------- Bons d'envoi (TEK-TREND → GADH) et de retour (GADH → TEK-TREND), un par date ---------- */
function bonsDates(lot, stage){
  var lm = {}, o = {};
  S.lines.forEach(function(l){ if (l.lot === lot) lm[l.id] = 1; });
  S.moves.forEach(function(m){ if (m.stage !== stage || !lm[m.lineId]) return; var e = o[m.date] || (o[m.date] = {q:0, nc:0}); e.q += m.qty; e.nc += m.nc || 0; });
  return Object.keys(o).sort().reverse().filter(function(d){ return o[d].q || o[d].nc; }).map(function(d){ return {date:d, q:o[d].q, nc:o[d].nc}; });
}
function bonNumero(lot, stage, date){ return (stage === "gadh" ? "BE-" : "BR-") + lot + "-" + String(date).replace(/-/g, ""); }

  S.moves.forEach(function(m){ if (m.stage === stage && m.date === date){ var a = agg[m.lineId] || (agg[m.lineId] = {q:0, nc:0, motifs:{}}); a.q += m.qty; a.nc += m.nc || 0; if (m.nc && m.motif) a.motifs[m.motif] = 1; } });
  var rows = filtered(lot, "*").filter(function(l){ var a = agg[l.id]; if (a && a.nc) anyNc = true; return a && (a.q || a.nc); });
  var heads = ["Model", "Libellé", "Taille", "Client", envoi ? "Quantité envoyée" : "Quantité retournée"].concat(anyNc ? ["NC", "Motif NC"] : []);
  var nc = heads.length, last = nc - 1;

  var T = {b:1, sz:14, al:"l"}, I = {sz:10, al:"l"}, IB = {b:1, sz:10, al:"l"};
  gset(g, 0, 0, envoi ? "BON D'ENVOI — TEK-TREND → GADH" : "BON DE RETOUR — GADH → TEK-TREND", T); gmerge(g, 0, 0, 0, last); g.rows[0].h = 24;
  gset(g, 1, 0, "N° " + bonNumero(lot, stage, date), IB); gmerge(g, 1, 0, 1, 1);
  gset(g, 1, 2, "Date : " + dmyL(date), IB); gmerge(g, 1, 2, 1, last);
  gset(g, 2, 0, "Commande (lot) : " + lot, I); gmerge(g, 2, 0, 2, 1);
  gset(g, 2, 2, "Client final : PERCKO", I); gmerge(g, 2, 2, 2, last);
  gset(g, 3, 0, "Expéditeur : " + (envoi ? "TEK-TREND" : "GADH TUNISIA"), I); gmerge(g, 3, 0, 3, 1);
  gset(g, 3, 2, "Destinataire : " + (envoi ? "GADH TUNISIA (assemblage)" : "TEK-TREND"), I); gmerge(g, 3, 2, 3, last);
  gset(g, 4, 0, "", null); g.rows[4].h = 6;

  heads.forEach(function(h, i){ gset(g, 5, i, h, H); }); g.rows[5].h = 28; g.sticky = 6;
  var r = 6, tq = 0, tn = 0, mTop = null, mModel = null;
  rows.forEach(function(l){
    var a = agg[l.id];
    if (l.model !== mModel){ if (mTop !== null) gmerge(g, mTop, 0, r - 1, 0); mTop = r; mModel = l.model; }
    gset(g, r, 0, r === mTop ? l.model : "", {b:1, sz:10, al:"c", bd:"t", wrap:1});
    gset(g, r, 1, l.lib, {sz:10, al:"l", bd:"t", wrap:1}); gset(g, r, 2, l.size, {b:1, sz:10, al:"c", bd:"t"});
    gset(g, r, 3, l.client, {sz:10, al:"c", bd:"t"}); gset(g, r, 4, a.q, {b:1, sz:11, al:"c", bd:"t"});
    if (anyNc){ gset(g, r, 5, a.nc || "", {sz:11, al:"c", bd:"t", fg:a.nc ? "C00000" : "000000"}); gset(g, r, 6, Object.keys(a.motifs).join(", "), {sz:9, al:"l", bd:"t", wrap:1}); }
    tq += a.q; tn += a.nc; r++;

/* ---------- Non-conformités par motif ---------- */
function ncParMotif(lot){
  var lm = {}, t = {}, st = {}, tot = 0;
  S.lines.forEach(function(l){ if (l.lot === lot) lm[l.id] = 1; });
  S.moves.forEach(function(m){
    if (!m.nc || !lm[m.lineId]) return;
    var k = m.motif || "Motif non précisé", o = t[k] || (t[k] = {tot:0});
    o[m.stage] = (o[m.stage] || 0) + m.nc; o.tot += m.nc; st[m.stage] = 1; tot += m.nc;
  });
  var motifs = Object.keys(t).sort(function(a, b){ return t[b].tot - t[a].tot; });
  return {motifs:motifs, t:t, stages:STG_KEYS.filter(function(k){ return st[k]; }), tot:tot};
}

  var d = ncParMotif(lot), c = el("div", {class:"card"}, el("h2", {text:"Non-conformités par motif"}));
  if (!d.tot){ c.appendChild(el("p", {class:"mut", text:"Aucune pièce non conforme pour ce lot."})); return c; }

    tr.appendChild(el("td", {class:"b", text:fmt(o.tot)})); tr.appendChild(el("td", {text:Math.round(o.tot / d.tot * 100) + " %"}));

  d.stages.forEach(function(s){ var x = 0; d.motifs.forEach(function(k){ x += d.t[k][s] || 0; }); tt.appendChild(el("td", {text:fmt(x)})); });
  tt.appendChild(el("td", {text:fmt(d.tot)})); tt.appendChild(el("td", {text:"100 %"})); tb.appendChild(tt);
  t.appendChild(tb); c.appendChild(el("div", {class:"tw"}, t));

    gr.ls.forEach(function(l){
      var t = tot[l.id] || {}, cur = t[st] || 0, n = (ncT[l.id] || {})[st] || 0, nxt = null;

      var inp = el("input", {type:"number", inputmode:"numeric", min:"0", value:String(ui.sxModV[l.id] !== undefined ? ui.sxModV[l.id] : cur)});

  var rv = null;
  if (rouv){ rv = el("input", {type:"checkbox"}); c.appendChild(el("label", {class:"mut", style:"display:flex;align-items:center;gap:8px;margin:8px 0 0"}, rv, "Rouvrir la coupe (elle était clôturée avec écart)")); }

/* pièces avec défaut : nombre + motif, en grands boutons */
function sxDefaut(it, capped){
  var box = sxModal(), n = ui.fv[it.key + "n"] || 0, motif = ui.fv[it.key + "m"] || "";
  var max = capped ? it.disp : 1e9;
  var aff = el("div", {class:"sx-ncval", text:String(n)});
  function poser(x){ n = Math.max(0, Math.min(max, x)); aff.textContent = String(n); ok.disabled = !!(n && !motif); }
  box.appendChild(el("div", {class:"sx-nm", text:"Pièces avec défaut"}));
  box.appendChild(el("div", {class:"mut", text:nomDoc(it.l.lib) + " · taille " + it.l.size + " · " + it.l.client}));
  box.appendChild(el("div", {class:"sx-ncstep"}, el("button", {text:"−", onclick:function(){ poser(n - 1); }}), aff, el("button", {text:"+", onclick:function(){ poser(n + 1); }})));
  box.appendChild(el("div", {class:"mut", style:"margin:4px 0 8px;font-weight:600", text:"Quel défaut ?"}));
  var grid = el("div", {class:"sx-motifs"});
  S.motifs.forEach(function(x){ var b = el("button", {class:x === motif ? "on" : "", text:x, onclick:function(){ motif = x; Array.prototype.forEach.call(grid.children, function(c){ c.classList.toggle("on", c === b); }); ok.disabled = !!(n && !motif); }}); grid.appendChild(b); });
  box.appendChild(grid);
  var ok = el("button", {class:"sx-go", style:"width:100%;margin-top:14px", text:"OK", onclick:function(){
    ui.fv[it.key + "n"] = n; ui.fv[it.key + "m"] = n ? motif : "";
    if (capped){ var q = it.key in ui.fv ? ui.fv[it.key] : it.disp; if (q + n > it.disp) ui.fv[it.key] = Math.max(0, it.disp - n); else if (!(it.key in ui.fv)) ui.fv[it.key] = Math.max(0, it.disp - n); }
    sxClose(); render(true);
  }});
  box.appendChild(ok);
  box.appendChild(el("button", {class:"sx-annul", text:"Annuler", onclick:sxClose}));
  poser(n);
}

function sxConfirmer(lot, st, items, val, nc){
  var date = ui.fdate || today(), nm = [], tq = 0, tn = 0, sansMotif = null;
  items.forEach(function(it){
    var q = val(it), n = nc(it); if (!q && !n) return;
    if (n && !ui.fv[it.key + "m"]) sansMotif = it;
    var m = {id:nid("M"), date:date, lineId:it.l.id, stage:st, qty:q, nc:n, note:ui.fnote || ""}; if (n && ui.fv[it.key + "m"]) m.motif = ui.fv[it.key + "m"];
    nm.push(m); tq += q; tn += n;
  });
  if (!nm.length){ toast("Aucune pièce à valider."); return; }
  if (sansMotif){ toast("Choisissez le défaut des pièces " + sansMotif.l.size + "."); sxDefaut(sansMotif, st !== "cp"); return; }
  var auto = sxAutoMoves(st, nm, date);
  try { checkMoves(auto.concat(nm)); } catch (e) { toast(e.message); return; }
  ui.pend = {stage:st, simple:true};
  var box = sxModal();
  box.appendChild(el("div", {class:"sx-conf-ic"}, sxIcon(st)));
  box.appendChild(el("div", {class:"sx-nm", style:"text-align:center", text:(VUE === "gadh" ? "Retour à TEK-TREND" : SX_NOM[st]) + " — on valide ?"}));
  var r = el("div", {class:"sx-recap"});
  r.appendChild(el("div", null, el("b", {text:fmt(tq)}), el("span", {text:"pièce(s) bonne(s)"})));
  if (tn) r.appendChild(el("div", {class:"bad"}, el("b", {text:fmt(tn)}), el("span", {text:"défaut(s)"})));
  box.appendChild(r);
  box.appendChild(el("div", {class:"mut", style:"text-align:center;margin-bottom:12px", text:"Date : " + (date === today() ? "aujourd'hui" : dmy(date)) + (ui.fnote ? " · " + ui.fnote : "") + " · lot " + lot}));
  box.appendChild(el("button", {class:"sx-go", style:"width:100%", text:"✔ Oui, valider", onclick:function(){
    var ok = commit(function(){
      checkMoves(auto.concat(nm));
      auto.concat(nm).forEach(function(m){ S.moves.push(m); });
      if (st === "cp" && VUE !== "gadh" && !((S.lots[lot] || {}).envois || []).length) marquerEnvoiCoupe(lot, date, "noté automatiquement à la première coupe");
      ui.fv = {}; ui.pend = null;
    });
    if (ok) sxBravo(lot, st, tq, tn);
  }}));
  box.appendChild(el("button", {class:"sx-annul", text:"Non, revenir", onclick:function(){ ui.pend = null; sxFermer(); }}));
}
function sxBravo(lot, st, tq, tn){
  var rows = filtered(lot, "*").filter(function(l){ return ui.fcli === "*" || !ui.fcli || l.client === ui.fcli; }), keys = SX.map(function(x){ return x[0]; }), nx = null;
  if (VUE !== "gadh") keys.slice(keys.indexOf(st) + 1).forEach(function(k){ if (!nx && !sxEstAuto(k) && sxAFaire(k, lot, rows).a > 0) nx = k; });
  ui.pend = {bravo:true};
  var box = sxModal();
  box.appendChild(el("div", {class:"sx-bravo", text:"✓"}));
  box.appendChild(el("div", {class:"sx-nm", style:"text-align:center", text:"C'est enregistré"}));
  box.appendChild(el("div", {class:"mut", style:"text-align:center;margin-bottom:14px", text:fmt(tq) + " pièce(s) bonne(s)" + (tn ? " et " + fmt(tn) + " défaut(s)" : "") + " — " + (VUE === "gadh" ? "retour à TEK-TREND" : SX_NOM[st])}));
  if (nx) box.appendChild(el("button", {class:"sx-go", style:"width:100%", text:"Étape suivante : " + SX_NOM[nx] + " (" + fmt(sxAFaire(nx, lot, rows).a) + ")", onclick:function(){ sxClose(); sxOuvrir(nx); }}));
  box.appendChild(el("button", {class:nx ? "sx-annul" : "sx-go", style:nx ? "" : "width:100%", text:VUE === "gadh" ? "OK" : "Retour aux étapes", onclick:function(){ sxClose(); if (VUE !== "gadh"){ ui.sxOpen = false; } render(); }}));
}
